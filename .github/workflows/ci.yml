name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q main.py config.py admin_bot collector db utils

      - name: Check application imports
        run: python -c 'import main; import db.models'

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  postgres:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://tg_aggregator_test:test_password@127.0.0.1:5432/tg_aggregator_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tg_aggregator_test
          POSTGRES_USER: tg_aggregator_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg_aggregator_test -d tg_aggregator_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run PostgreSQL integration tests
        run: python -m unittest discover -s integration_tests -t . -v
