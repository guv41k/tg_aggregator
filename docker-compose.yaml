services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tg_aggregator
      POSTGRES_USER: tg_aggregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_aggregator -d tg_aggregator"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?Set COLLECTOR_TOKEN in .env}
      ADMIN_IDS: ${ADMIN_IDS:?Set ADMIN_IDS in .env}
      DATABASE_URL: postgresql+psycopg2://tg_aggregator:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/tg_aggregator
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
